spring.application.name=GridMind AI Backend
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
auth.registration.enabled=${AUTH_REGISTRATION_ENABLED:true}
auth.bootstrap.admin.email=${ADMIN_EMAIL:${GRIDMIND_ADMIN_EMAIL:}}
auth.bootstrap.admin.password=${ADMIN_PASSWORD:${GRIDMIND_ADMIN_PASSWORD:}}
auth.bootstrap.demo.enabled=${DEMO_MODE:false}
auth.bootstrap.demo.email=${DEMO_EMAIL:${GRIDMIND_DEMO_EMAIL:}}
auth.bootstrap.demo.password=${DEMO_PASSWORD:${GRIDMIND_DEMO_PASSWORD:}}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:900}
auth.login.lockout-seconds=${AUTH_LOGIN_LOCKOUT_SECONDS:900}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gridmind_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gridmind_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
gridmind.ml.anomaly.threshold=${GRIDMIND_ML_ANOMALY_THRESHOLD:0.7}
gridmind.retention.days=${GRIDMIND_RETENTION_DAYS:7}

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# WebSocket
spring.websocket.path=/ws/stream
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Anthropic Claude explanations and on-demand predictions
claude.api-key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-sonnet-4-5}
claude.max-requests-per-day=${CLAUDE_MAX_REQUESTS_PER_DAY:20}
telemetry.device-token=${TELEMETRY_DEVICE_TOKEN:}
telemetry.device-owner-email=${TELEMETRY_DEVICE_OWNER_EMAIL:${auth.bootstrap.admin.email:}}

# Logging
logging.level.com.gridmind=INFO
logging.level.org.springframework.web=INFO
